version: "3.9"

services:
  backend:
    build: ./backend
    container_name: disaster-platform-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - backend_db:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/disaster_platform.db
      - FRONTEND_ORIGIN=http://localhost:5173
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: disaster-platform-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000

volumes:
  backend_db:
